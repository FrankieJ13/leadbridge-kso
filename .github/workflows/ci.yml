name: security-and-regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python syntax and security tests
        run: |
          python -m pip install --disable-pip-version-check -r apps/max-chat-ocr-postprocessor/requirements.txt
          python -m py_compile apps/max-chat-ocr-postprocessor/max_chat_ocr.py tools/build_release_packages.py tools/sync_web_assets.py
          python -m unittest discover -s tests/python -v

      - name: JavaScript security and matching tests
        run: node --test tests/js/*.test.js

      - name: Validate extension and PWA manifests
        run: |
          python -m json.tool apps/max-chat-local-exporter/manifest.json >/dev/null
          python -m json.tool apps/leadbridge-web/manifest.webmanifest >/dev/null
          node --check apps/max-chat-local-exporter/background.js
          node --check apps/max-chat-local-exporter/content.js
          node --check apps/max-chat-local-exporter/ocr_host.js
          node --check apps/max-chat-local-exporter/ocr_host_client.js
          node --check apps/max-chat-local-exporter/message_identity.js
          node --check apps/leadbridge-web/app.js
          node --check apps/leadbridge-web/src/amo-schema.js
          node --check apps/leadbridge-web/src/online-csv.js
          node --check < integrations/google-apps-script-amocrm/Code.gs

      - name: Verify canonical Web source
        run: python tools/sync_web_assets.py --verify

      - name: Build packages and verify integrity
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python tools/build_release_packages.py
          cp releases/SHA256SUMS /tmp/leadbridge-sha256-first
          python tools/build_release_packages.py
          diff -u /tmp/leadbridge-sha256-first releases/SHA256SUMS
          python tools/build_release_packages.py --verify
          python tools/sync_web_assets.py --verify
          for archive in releases/packages/*.zip; do unzip -tqq "$archive"; done

      - name: Reject common committed secret formats
        run: |
          (cd apps/max-chat-local-exporter/vendor && sha256sum --check SHA256SUMS)
          if git grep -nE '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!*.zip' ':!apps/max-chat-local-exporter/vendor/tesseract/core/tesseract-core-simd-lstm.wasm.js'; then
            echo 'Potential secret found in tracked text files.' >&2
            exit 1
          fi
