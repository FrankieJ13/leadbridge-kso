name: security-and-regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Python syntax and security tests
        run: |
          python -m pip install --disable-pip-version-check -r apps/max-chat-ocr-postprocessor/requirements.txt
          python -m py_compile apps/max-chat-ocr-postprocessor/max_chat_ocr.py tools/build_release_packages.py tools/sync_web_assets.py
          python -m unittest discover -s tests/python -v

      - name: JavaScript security and matching tests
        run: node --test tests/js/*.test.js

      - name: Validate extension and PWA manifests
        run: |
          python -m json.tool apps/max-chat-local-exporter/manifest.json >/dev/null
          python -m json.tool apps/leadbridge-web/manifest.webmanifest >/dev/null
          node --check apps/max-chat-local-exporter/background.js
          node --check apps/max-chat-local-exporter/content.js
          node --check apps/leadbridge-web/app.js
          node --check apps/leadbridge-web/src/amo-schema.js
          node --check apps/leadbridge-web/src/online-csv.js
          node --check < integrations/google-apps-script-amocrm/Code.gs

      - name: Verify canonical Web source
        run: python tools/sync_web_assets.py --verify

      - name: Build packages and verify integrity
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python tools/build_release_packages.py
          cp releases/SHA256SUMS /tmp/leadbridge-sha256-first
          python tools/build_release_packages.py
          diff -u /tmp/leadbridge-sha256-first releases/SHA256SUMS
          python tools/build_release_packages.py --verify
          python tools/sync_web_assets.py --verify
          for archive in releases/packages/*.zip; do unzip -tqq "$archive"; done
          test "$(head -c 2 releases/packages/LeadBridgeKSO-Setup-Windows-v8.2.10.0848.exe)" = "MZ"

      - name: Reject common committed secret formats
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- ':!*.zip'; then
            echo 'Potential secret found in tracked text files.' >&2
            exit 1
          fi

  windows-installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install the autonomous EXE
        shell: powershell
        run: |
          $setup = Resolve-Path 'releases/packages/LeadBridgeKSO-Setup-Windows-v8.2.10.0848.exe'
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
          if (-not $process.WaitForExit(300000)) {
            Get-Process | Where-Object {
              $_.ProcessName -match 'LeadBridge|python|tesseract'
            } | Format-Table -AutoSize | Out-String | Write-Host
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Installer did not finish within 5 minutes.'
          }
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }

      - name: Verify installed product and OCR runtime
        shell: powershell
        run: |
          $required = @(
            'C:\LeadBridgeKSO\tools\leadbridge\index.html',
            'C:\LeadBridgeKSO\tools\max-chat-ocr-postprocessor\max_chat_ocr.py',
            'C:\LeadBridgeKSO\launchers\run_ocr_windows.bat',
            'C:\LeadBridgeKSO\runtime\python\python.exe',
            'C:\LeadBridgeKSO\runtime\tesseract\tesseract.exe',
            'C:\LeadBridgeKSO\runtime\tesseract\tessdata\rus.traineddata',
            'C:\LeadBridgeKSO\runtime\tesseract\tessdata\eng.traineddata',
            'C:\Users\Public\Desktop\LeadBridge KSO.lnk'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing installed file: $path" }
          }
          & 'C:\LeadBridgeKSO\runtime\python\python.exe' -c 'import PIL; print(PIL.__version__)'
          $languages = & 'C:\LeadBridgeKSO\runtime\tesseract\tesseract.exe' --list-langs
          if ($languages -notcontains 'rus' -or $languages -notcontains 'eng') {
            throw "Tesseract languages are incomplete: $($languages -join ', ')"
          }
