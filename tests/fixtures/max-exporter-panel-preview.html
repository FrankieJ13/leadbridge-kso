<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAX Exporter Panel Preview</title>
  <link rel="stylesheet" href="../../apps/max-chat-local-exporter/content.css?v=ocr4">
  <style>
    html, body { min-height: 100%; margin: 0; }
    body {
      background: #83c2f5;
      background-image: linear-gradient(45deg, rgba(255,255,255,.13) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.13) 75%);
      background-size: 96px 96px;
    }
  </style>
</head>
<body>
  <script src="../../apps/max-chat-local-exporter/panel_ui.js?v=ocr4"></script>
  <script src="../../apps/max-chat-local-exporter/panel_motion.js?v=ocr4"></script>
  <script>
    const panel = document.createElement('aside');
    panel.id = 'max-local-exporter-panel';
    panel.setAttribute('aria-label', 'MAX Chat Exporter');
    panel.innerHTML = MaxExporterPanelUI.markup();
    document.body.appendChild(panel);
    MaxExporterPanelMotion.install(panel);
    if (new URLSearchParams(location.search).get('feedback') === 'error') {
      const feedback = document.getElementById('maxle-ocr-feedback');
      feedback.hidden = false;
      feedback.dataset.kind = 'error';
      feedback.textContent = 'OCR не запущен.\nЛокальный OCR-мост устарел. Переустанови актуальный пакет LeadBridge KSO.';
    }
  </script>
</body>
</html>
