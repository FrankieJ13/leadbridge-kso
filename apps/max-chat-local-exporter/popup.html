<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAX Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>MAX Chat Exporter</h1>
    <p>Открой нужный чат в <b>web.max.ru</b>, затем покажи панель экспорта.</p>
    <button id="showPanel">Показать панель</button>
    <fieldset>
      <legend>После OCR открыть LeadBridge</legend>
      <label><input type="radio" name="leadbridgeMode" value="online"> <span><b>Онлайн</b><small>GitHub Pages</small></span></label>
      <label><input type="radio" name="leadbridgeMode" value="local"> <span><b>Локально</b><small>Встроенный index.html без интернета</small></span></label>
    </fieldset>
    <p id="status" role="status"></p>
    <p class="muted">Данные сохраняются локально в браузере. Расширение не отправляет переписку на серверы.</p>
    <p id="version" class="version"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
